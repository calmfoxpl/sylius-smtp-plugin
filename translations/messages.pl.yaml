# The provider hints: their English text is the key, because they live in the provider
# catalogue next to the host and the port they describe.

'A domain created in the European region only answers on the European host.': 'Domena utworzona w regionie europejskim odpowiada tylko na europejskim hoście.'
'A mailbox is not a sending service: Google stops a free account at around 500 messages a day and a Workspace one at around 2000, and counts every recipient. Fine for a small shop, a bad surprise for a busy one.': 'Skrzynka pocztowa nie jest usługą do wysyłki: Google zatrzymuje darmowe konto przy około 500 wiadomościach na dobę, a konto Workspace przy około 2000, i liczy każdego odbiorcę. Dla małego sklepu w porządku, dla obleganego — nieprzyjemna niespodzianka.'
'Always the literal word SMTP_Injection. It is filled in for you and cannot be changed.': 'Zawsze dosłownie SMTP_Injection. Wypełniamy to za Ciebie i nie da się tego zmienić.'
'Always the literal word apikey. It is filled in for you and cannot be changed.': 'Zawsze dosłownie apikey. Wypełniamy to za Ciebie i nie da się tego zmienić.'
'Always the literal word resend. It is filled in for you and cannot be changed.': 'Zawsze dosłownie resend. Wypełniamy to za Ciebie i nie da się tego zmienić.'
'An API key from the SMTP & API Info page.': 'Klucz API ze strony SMTP & API Info.'
'An API key from the dashboard.': 'Klucz API z panelu dostawcy.'
'An API key with the Mail Send permission. It is shown once, when it is created.': 'Klucz API z uprawnieniem Mail Send. Jest pokazywany raz, przy tworzeniu.'
'An API key with the Send via SMTP permission.': 'Klucz API z uprawnieniem Send via SMTP.'
'An App password, not the account password. Google only issues one once two-step verification is on; the spaces it shows may be typed or left out.': 'Hasło aplikacji, nie hasło do konta. Google wydaje je dopiero po włączeniu weryfikacji dwuetapowej; pokazywane spacje można przepisać albo pominąć.'
'An SES SMTP user name. These are created under SMTP settings and are not the same thing as an AWS access key.': 'Nazwa użytkownika SMTP z SES. Tworzy się ją w ustawieniach SMTP i nie jest tym samym co klucz dostępu AWS.'
'An SMTP credential generated in the account, not the password you sign in with.': 'Dane SMTP wygenerowane w koncie, nie hasło, którym się logujesz.'
'An SMTP key generated on the same page. The account password will not work.': 'Klucz SMTP wygenerowany na tej samej stronie. Hasło do konta nie zadziała.'
'An SMTP user created in the dashboard, not the address you sign in with.': 'Użytkownik SMTP utworzony w panelu, nie adres, którym się logujesz.'
'An application-specific password, which is what Zoho issues once two-factor authentication is on.': 'Hasło dla aplikacji, czyli to, co Zoho wydaje po włączeniu uwierzytelniania dwuskładnikowego.'
'Australia': 'Australia'
'Europe': 'Europa'
'Frankfurt': 'Frankfurt'
'If port 587 is blocked outbound, 2525 answers the same way.': 'Jeśli port 587 jest zablokowany wychodząco, 2525 odpowiada tak samo.'
'India': 'Indie'
'Ireland': 'Irlandia'
'North Virginia': 'Wirginia Północna'
'Oregon': 'Oregon'
'Pick the host of the data centre the account lives in; the addresses are not interchangeable.': 'Wybierz host centrum danych, w którym mieszka konto; te adresy nie są wymienne.'
'Pick the host of the region the identity was verified in, and remember that a new account is in the sandbox until Amazon lifts it: it can only write to verified addresses.': 'Wybierz host regionu, w którym zweryfikowano tożsamość, i pamiętaj, że nowe konto siedzi w piaskownicy, dopóki Amazon go z niej nie wyjmie: może pisać wyłącznie na zweryfikowane adresy.'
'Postmark keeps transactional and bulk messages on separate streams; order e-mail belongs on the transactional one.': 'Postmark trzyma wiadomości transakcyjne i masowe na osobnych strumieniach; poczta o zamówieniach należy do transakcyjnego.'
'SMTP AUTH is off by default and has to be enabled for the mailbox in the Microsoft 365 admin centre. Microsoft also throttles at around 30 messages a minute and 10 000 a day, and is retiring password-based SMTP: for order e-mail a provider built for sending is the safer home.': 'SMTP AUTH jest domyślnie wyłączony i trzeba go włączyć dla skrzynki w centrum administracyjnym Microsoft 365. Microsoft ogranicza też tempo do około 30 wiadomości na minutę i 10 000 na dobę, a do tego wycofuje SMTP na hasło: dla poczty o zamówieniach bezpieczniejszym domem jest dostawca stworzony do wysyłki.'
'The API key from the account settings.': 'Klucz API z ustawień konta.'
'The SMTP login from SMTP & API → SMTP, which is an e-mail address and not always the one you sign in with.': 'Login SMTP ze strony SMTP & API → SMTP; jest to adres e-mail i nie zawsze ten, którym się logujesz.'
'The SMTP login of the sending domain, usually postmaster@your-domain.': 'Login SMTP domeny wysyłającej, zwykle postmaster@twoja-domena.'
'The SMTP password issued with that user name, which is shown only once.': 'Hasło SMTP wydane razem z tą nazwą użytkownika, pokazywane tylko raz.'
'The SMTP password shown for that domain. Resetting it there breaks sending here until it is copied again.': 'Hasło SMTP pokazane dla tej domeny. Zmiana go tam psuje wysyłkę tutaj, dopóki nie skopiujesz nowego.'
'The Server API token from the server''s API Tokens tab.': 'Token Server API z zakładki API Tokens danego serwera.'
'The Server API token, the same value as the password. It is filled in for you.': 'Token Server API, ta sama wartość co hasło. Wypełniamy to za Ciebie.'
'The e-mail address of the account, or any Mandrill user name.': 'Adres e-mail konta albo dowolna nazwa użytkownika Mandrill.'
'The e-mail address of the account.': 'Adres e-mail konta.'
'The full address of the mailbox, which has to be the address messages are sent from.': 'Pełny adres skrzynki, który musi być adresem, z którego wysyłane są wiadomości.'
'The full address of the mailbox.': 'Pełny adres skrzynki.'
'The password for that login. Leave both fields empty for a relay that authenticates by IP address.': 'Hasło do tego loginu. Przy przekaźniku uwierzytelniającym po adresie IP zostaw oba pola puste.'
'The password of that mailbox, or an app password where multi-factor authentication is on.': 'Hasło tej skrzynki albo hasło aplikacji, jeśli włączone jest uwierzytelnianie wieloskładnikowe.'
'The password set for that SMTP user.': 'Hasło ustawione dla tego użytkownika SMTP.'
'The secret key that belongs to that API key.': 'Klucz tajny należący do tego klucza API.'
'Whatever the server expects as the login, usually a full e-mail address.': 'To, czego serwer oczekuje jako loginu, zwykle pełny adres e-mail.'
