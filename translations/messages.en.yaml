calmfox_smtp.issue.spf_no_all: 'The SPF record says nothing about senders it has not listed. Ending it with ~all, or with -all once everything is verified, is what makes it mean something.'
calmfox_smtp.issue.starttls_on_implicit_port: 'Port %1% usually expects TLS from the first byte rather than STARTTLS.'
calmfox_smtp.issue.username_missing: 'There is no user name, although the settings say to log in.'

